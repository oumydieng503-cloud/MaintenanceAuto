databases:
  - name: maintenanceauto-db
    plan: free

services:
  - type: web
    name: maintenanceauto
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://VOTRE-APP.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: maintenanceauto-db
          property: connectionString
