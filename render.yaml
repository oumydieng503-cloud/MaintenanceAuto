databases:
  - name: maintenanceauto-db
    plan: free

services:
  - type: web
    name: maintenanceauto
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://maintenanceauto.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: maintenanceauto-db
          property: connectionString
