<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaintenanceAuto - Connexion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 420px;
        }
        .card-header {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            border-radius: 20px 20px 0 0 !important;
            padding: 30px;
            text-align: center;
        }
        .btn-login {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #c0392b, #a93226);
            transform: translateY(-2px);
            transition: all 0.3s;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 2px solid #eee;
        }
        .form-control:focus {
            border-color: #e74c3c;
            box-shadow: 0 0 0 0.2rem rgba(231,76,60,0.25);
        }
        .alert {
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <i class="fas fa-car fa-3x text-white mb-3"></i>
            <h3 class="text-white mb-0">MaintenanceAuto</h3>
            <p class="text-white-50 mb-0">Gestion de garage automobile</p>
        </div>
        <div class="card-body p-4">
            <h5 class="text-center mb-4 text-muted">Connexion</h5>

            <div id="alert-error" class="alert alert-danger d-none">
                <i class="fas fa-exclamation-circle me-2"></i>
                <span id="error-message"></span>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Nom d'utilisateur</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user text-muted"></i></span>
                    <input type="text" id="username" class="form-control" placeholder="Entrez votre username">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Mot de passe</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" id="password" class="form-control" placeholder="Entrez votre mot de passe">
                    <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()">
                        <i class="fas fa-eye" id="eye-icon"></i>
                    </button>
                </div>
            </div>

            <button class="btn btn-login btn-danger w-100 text-white" onclick="login()">
                <i class="fas fa-sign-in-alt me-2"></i>Se connecter
            </button>

            <p class="text-center text-muted mt-3 mb-0">
                Pas encore de compte ?
                <a href="/inscription/" class="text-danger fw-semibold text-decoration-none">S'inscrire</a>
            </p>
        </div>
    </div>

    <script>
        function togglePassword() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('eye-icon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                pwd.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showError('Veuillez remplir tous les champs');
                return;
            }

            try {
                const response = await fetch('/api/auth/login/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('access_token', data.access);
                    localStorage.setItem('refresh_token', data.refresh);
                    localStorage.setItem('username', username);

                    const profilResponse = await fetch('/api/profils/me/', {
                        headers: { 'Authorization': `Bearer ${data.access}` }
                    });
                    const profil = await profilResponse.json();

                    if (profilResponse.ok && profil.role) {
                        localStorage.setItem('role', profil.role);
                        localStorage.setItem('user_id', profil.user.id);
                        if (profil.role === 'client') {
                            window.location.href = '/dashboard/client/';
                        } else if (profil.role === 'mecanicien') {
                            window.location.href = '/dashboard/mecanicien/';
                        } else if (profil.role === 'administrateur') {
                            window.location.href = '/dashboard/admin/';
                        }
                    } else {
                        showError('Profil utilisateur introuvable');
                    }
                } else {
                    showError('Identifiants incorrects');
                }
            } catch (error) {
                showError('Erreur de connexion au serveur');
            }
        }

        function showError(message) {
            const alert = document.getElementById('alert-error');
            document.getElementById('error-message').textContent = message;
            alert.classList.remove('d-none');
        }

        // Login avec la touche Entrée
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
